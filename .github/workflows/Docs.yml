name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/julia-docdeploy@v1
        with:
          install-package: true
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
